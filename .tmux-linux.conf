# Linux-specific tmux bindings
# Sourced automatically by .tmux.conf on Linux

# @key Ctrl+Alt+Arrows       Navigate panes
# ─── Pane navigation: Ctrl+Alt+Arrow (no prefix) ────────────────────

bind -n C-M-Left  select-pane -L
bind -n C-M-Down  select-pane -D
bind -n C-M-Up    select-pane -U
bind -n C-M-Right select-pane -R

# @key Ctrl+Alt+Shift+Arrows Resize panes
# ─── Pane resize: Ctrl+Alt+Shift+Arrow (no prefix) ──────────────────

bind -n C-M-S-Left  resize-pane -L 2
bind -n C-M-S-Down  resize-pane -D 2
bind -n C-M-S-Up    resize-pane -U 2
bind -n C-M-S-Right resize-pane -R 2

# @key Alt+1..9              Jump to window
# ─── Window jump: Alt+1..9 (no prefix) ──────────────────────────────

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# @key Alt+Left/Right        Previous/next window
# ─── Window cycling: Alt+Left/Right (no prefix) ─────────────────────

bind -n M-Left  previous-window
bind -n M-Right next-window

# @key Alt+Up/Down           Previous/next session
# ─── Session cycling: Alt+Up/Down (no prefix) ───────────────────────

bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# @key prefix+k              Kill window
# @key prefix+K              Kill session
