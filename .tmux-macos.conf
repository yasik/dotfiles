# macOS-specific tmux bindings
# Sourced automatically by .tmux.conf on macOS
#
# macOS reserves Ctrl+Arrow for Mission Control and Option produces
# special characters by default, so we use prefix-based bindings.
#
# Remaps:  prefix+k → pane-up (was kill-window, now prefix+q)
#          prefix+K → resize-up (was kill-session, now prefix+Q)

# ─── Pane navigation: prefix + h/j/k/l (vim-style) ─────────────────

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resize: prefix + H/J/K/L (repeatable) ────────────────────

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# ─── Window cycling: prefix + [ / ] ──────────────────────────────────

bind [ previous-window
bind ] next-window

# ─── Remapped controls ──────────────────────────────────────────────

bind q kill-window
bind Q kill-session
