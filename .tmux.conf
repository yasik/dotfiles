# ─── General ────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g aggressive-resize on
set -g detach-on-destroy off

# ─── Pane controls ──────────────────────────────────────────────────

# Split panes (vim-style: n=horizontal, v=vertical), inherit cwd
bind n split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Kill pane
bind x kill-pane

# Navigate panes: Ctrl+Alt+Arrow (no prefix)
bind -n C-M-Left  select-pane -L
bind -n C-M-Down  select-pane -D
bind -n C-M-Up    select-pane -U
bind -n C-M-Right select-pane -R

# Resize panes: Ctrl+Alt+Shift+Arrow (no prefix)
bind -n C-M-S-Left  resize-pane -L 2
bind -n C-M-S-Down  resize-pane -D 2
bind -n C-M-S-Up    resize-pane -U 2
bind -n C-M-S-Right resize-pane -R 2

# ─── Window navigation ──────────────────────────────────────────────

bind c new-window -c "#{pane_current_path}"
bind k kill-window
bind r command-prompt "rename-window '%%'"

# Jump to window by number: Alt+1..9 (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Cycle windows: Alt+Left/Right (no prefix)
bind -n M-Left  previous-window
bind -n M-Right next-window

# ─── Session controls ───────────────────────────────────────────────

bind C new-session
bind K kill-session
bind R command-prompt "rename-session '%%'"

# Previous/next session
bind p switch-client -p
bind N switch-client -n

# Cycle sessions: Alt+Up/Down (no prefix)
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# ─── Theme ──────────────────────────────────────────────────────────

# Status bar position
set -g status-position top
set -g status-interval 5

# Colors
set -g status-style "bg=default,fg=#565f89"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# Left: session name + prefix indicator
set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bold] #S #{?client_prefix,#[fg=#e0af68]PREFIX ,}"

# Right: hostname
set -g status-right-length 30
set -g status-right "#[fg=#565f89]#H "

# Window tabs
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-separator ""
